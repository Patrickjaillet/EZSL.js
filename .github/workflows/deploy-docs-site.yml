name: Deploy documentation site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ezsl-docs-site depends on the root package via "file:..", which
      # resolves to the root dist/ output at install time — the root
      # package must be built before `npm install` inside ezsl-docs-site.
      - name: Install and build the core ezsl package
        run: |
          npm ci
          npm run build
      - name: Install and build the docs site
        working-directory: ezsl-docs-site
        env:
          GITHUB_PAGES: "1"
        run: |
          npm install
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ezsl-docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
