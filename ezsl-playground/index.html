<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZSL.js Playground</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1a1a; color: #eee; font-family: system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #222; border-bottom: 1px solid #333; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  button { background: #3a6; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #4b7; }
  #share-status { font-size: 12px; color: #9c9; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; display: flex; min-height: 0; }
  #gallery-panel {
    width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid #333; background: #1e1e1e; overflow: hidden;
    transition: width 0.15s ease, min-width 0.15s ease;
  }
  #gallery-panel.collapsed { width: 0; min-width: 0; border-right: none; }
  #gallery-list { flex: 1; overflow-y: auto; }
  .gallery-item {
    padding: 8px 12px; font-size: 13px; cursor: pointer; color: #ccc;
    border-bottom: 1px solid #2a2a2a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gallery-item:hover { background: #2a2a2a; color: #fff; }
  .gallery-item.active { background: #2d4a38; color: #9f9; }
  .panel { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #333; }
  .panel:last-child { border-right: none; }
  .panel-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; padding: 6px 10px; background: #222; border-bottom: 1px solid #333; }
  #ezsl-editor { flex: 1; overflow: auto; position: relative; }
  #ezsl-editor .cm-editor { height: 100%; font-size: 13px; }
  #glsl-output { flex: 1; overflow: auto; margin: 0; padding: 10px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; color: #ccc; }
  .preview-panel { position: relative; background: #000; }
  #preview-canvas { width: 100%; height: 100%; display: block; }
  #error-overlay {
    position: absolute; inset: 0; margin: 0; padding: 16px;
    background: rgba(30, 0, 0, 0.94); color: #ff8a8a;
    font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
    overflow: auto; display: none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>EZSL.js Playground</h1>
    <button id="gallery-toggle">Gallery</button>
    <div class="spacer"></div>
    <span id="share-status"></span>
    <button id="share-button">Copy Share Link</button>
  </header>
  <main>
    <div id="gallery-panel">
      <div class="panel-label">Gallery (curated examples)</div>
      <div id="gallery-list"></div>
    </div>
    <div class="panel">
      <div class="panel-label">EZSL source</div>
      <div id="ezsl-editor"></div>
    </div>
    <div class="panel">
      <div class="panel-label">Generated GLSL</div>
      <pre id="glsl-output"></pre>
    </div>
    <div class="panel preview-panel">
      <div class="panel-label">Live preview</div>
      <canvas id="preview-canvas"></canvas>
      <pre id="error-overlay"></pre>
    </div>
  </main>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
