<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZSL.js Documentation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1a1a1a; color: #ddd; font-family: system-ui, sans-serif; }
  #app { display: flex; min-height: 100vh; }
  #nav { width: 240px; flex-shrink: 0; background: #1e1e1e; border-right: 1px solid #333; padding: 16px 0; }
  .nav-tier-heading { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; padding: 12px 16px 4px; }
  .nav-link { display: block; padding: 6px 16px; color: #bbb; text-decoration: none; font-size: 13px; }
  .nav-link:hover { background: #2a2a2a; color: #fff; }
  .nav-link.active { background: #2d4a38; color: #9f9; border-left: 2px solid #6c6; padding-left: 14px; }
  #content { flex: 1; max-width: 820px; padding: 32px 40px; line-height: 1.6; }
  #content h1 { font-size: 26px; margin-top: 0; }
  #content h2 { font-size: 19px; margin-top: 36px; border-bottom: 1px solid #333; padding-bottom: 6px; }
  #content p { color: #ccc; }
  #content a { color: #7bf; }
  #content code { background: #2a2a2a; padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }
  #content pre { background: #161616; padding: 12px; border-radius: 6px; overflow-x: auto; }
  #content pre code { background: none; padding: 0; }
  #content table { border-collapse: collapse; width: 100%; }
  #content th, #content td { border: 1px solid #333; padding: 6px 10px; text-align: left; font-size: 13px; }
  #content th { background: #222; }

  .live-block { display: flex; gap: 12px; margin: 20px 0; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
  .live-block-editor { flex: 1; min-width: 0; background: #161616; }
  .live-block-editor .cm-editor { font-size: 13px; }
  .live-block-preview { width: 160px; flex-shrink: 0; position: relative; background: #000; }
  .live-block-preview canvas { display: block; width: 160px; height: 160px; }
  .live-block-error {
    position: absolute; inset: 0; margin: 0; padding: 8px;
    background: rgba(30, 0, 0, 0.94); color: #ff8a8a;
    font: 10px/1.4 ui-monospace, monospace; white-space: pre-wrap;
    overflow: auto; display: none;
  }
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="content"></main>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
